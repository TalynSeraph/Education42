<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GCSE Homeschool Tracker</title>
  
  <!-- Mobile & PWA Optimization -->
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GCSE Tracker">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%232563eb'/><text x='50%' y='60%' font-size='60' text-anchor='middle' fill='white'>📚</text></svg>">

  <style>
    :root {
  /* Backgrounds */
  --bg-main: #faf7fd;       /* Soft pastel lavender mist */
  --card-bg: #ffffff;
  --border: #f1e8f9;        /* Pale lilac border */
  --border-dark: #d8c7ea;

  /* Typography */
  --text-primary: #3b274c;   /* Deep plum for high-contrast reading */
  --text-secondary: #7e6993; /* Muted violet-slate */

  /* Pastel Theme Accents */
  --accent: #9d65c9;         /* Pastel amethyst / lilac */
  --accent-hover: #864db5;
  --accent-light: #f7eefd;   /* Pale orchid tint */

  --pink-accent: #f472b6;    /* Soft candy rose */
  --pink-light: #fdf2f8;     /* Whispering blush */

  /* Functional Status Colors */
  --success: #15803d;
  --success-bg: #f0fdf4;
  --danger: #b91c1c;
  --danger-bg: #fff1f2;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* Header & Theme Tint */
header {
  background: #ffffff;
  border-bottom: 1px solid var(--border);
}

.logo span {
  background: var(--pink-accent) !important;
  color: #ffffff;
}

/* Nav Active States */
.nav-btn.active {
  color: var(--accent) !important;
}
.nav-btn.active svg {
  stroke: var(--accent) !important;
}

/* Segmented Day Selector */
.day-selector {
  background: var(--border) !important;
}
.day-btn.active {
  background: #ffffff !important;
  color: var(--accent) !important;
}

/* Lesson Cards */
.lesson-card {
  border-left: 5px solid var(--accent) !important;
}
.lesson-card.completed {
  border-left-color: var(--pink-accent) !important;
  background: var(--pink-light) !important;
}

/* Badges */
.badge-planned {
  background: var(--accent-light) !important;
  color: var(--accent) !important;
}
.badge-done {
  background: var(--pink-light) !important;
  color: #be185d !important;
}

/* Progress Fill */
.progress-bar-fill {
  background: linear-gradient(90deg, var(--accent), var(--pink-accent)) !important;
}

/* Buttons */
.btn-primary {
  background: var(--accent) !important;
  color: #ffffff !important;
}
.btn-primary:active {
  background: var(--accent-hover) !important;
}
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">GCSE Tracker <span>Y10</span></div>
    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);" id="schedule-term-label"></div>
  </div>
</header>

<main>
  <!-- 1. SCHEDULE LAYER -->
  <section id="pane-schedule" class="tab-pane active">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Timetable</span>
        <div style="display: flex; gap: 6px; align-items: center;">
          <select id="schedule-week-select" class="form-control" style="width: auto; padding: 6px 8px;" onchange="renderSchedule()"></select>
        </div>
      </div>

      <!-- Mobile Day Filter -->
      <div class="day-selector">
        <button class="day-btn active" onclick="switchDay('Monday')">Mon</button>
        <button class="day-btn" onclick="switchDay('Tuesday')">Tue</button>
        <button class="day-btn" onclick="switchDay('Wednesday')">Wed</button>
        <button class="day-btn" onclick="switchDay('Thursday')">Thu</button>
      </div>

      <div id="mobile-lessons-container"></div>
    </div>
  </section>

  <!-- 2. CURRICULUM LAYER -->
  <section id="pane-curriculum" class="tab-pane">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Curriculum Registry</span>
        <button class="btn btn-outline" style="font-size:0.8rem; padding:4px 8px; min-height:auto;" onclick="resetToDefault()">Reset Defaults</button>
      </div>
      <div id="curriculum-list"></div>
      <button class="btn btn-outline btn-block" style="margin-top: 10px;" onclick="exportData()">Export Data Backup (JSON)</button>
    </div>
  </section>

  <!-- 3. DIARY LAYER -->
  <section id="pane-diary" class="tab-pane">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Study Log</span>
        <input type="date" id="diary-date-picker" class="form-control" style="width: auto; padding: 6px 8px;" onchange="renderDiary()">
      </div>
      <div class="form-group">
        <label>Session Notes & Observations</label>
        <textarea id="diary-notes" class="form-control" placeholder="What was covered? Retrieval errors, misconceptions, progress..."></textarea>
      </div>
      <div class="form-group">
        <label>Unplanned / Extra Learning</label>
        <input type="text" id="diary-extra" class="form-control" placeholder="Documentaries, reading, independent study...">
      </div>
      <button class="btn btn-primary btn-block" onclick="saveDiaryEntry()">Save Log Entry</button>
      <div id="diary-history" style="margin-top: 20px;"></div>
    </div>
  </section>

  <!-- 4. PROGRESS LAYER -->
  <section id="pane-progress" class="tab-pane">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Progress Metrics</span>
      </div>
      <div id="progress-summary"></div>
    </div>
  </section>
</main>

<!-- Bottom Nav -->
<nav class="mobile-nav">
  <button class="nav-btn active" onclick="switchTab('schedule')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    Schedule
  </button>
  <button class="nav-btn" onclick="switchTab('curriculum')">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    Curriculum
  </button>
  <button class="nav-btn" onclick="switchTab('diary')">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
    Diary
  </button>
  <button class="nav-btn" onclick="switchTab('progress')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    Progress
  </button>
</nav>

<!-- Modal -->
<div id="lesson-modal" class="modal-backdrop">
  <div class="modal-dialog">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
      <h3 id="modal-subject" style="font-size: 1.1rem;"></h3>
      <span id="modal-status-badge" class="badge"></span>
    </div>
    <p id="modal-focus" style="color: var(--text-secondary); margin-bottom: 14px; font-weight: 600; font-size: 0.95rem;"></p>
    <div id="modal-content" style="background: var(--bg-main); padding: 12px; border-radius: 8px; font-size: 0.85rem; border: 1px solid var(--border); margin-bottom: 16px; white-space: pre-wrap; font-family: monospace; max-height: 240px; overflow-y: auto;"></div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button id="modal-toggle-btn" class="btn btn-primary btn-block" onclick="toggleLessonCompletion()"></button>
      <button class="btn btn-outline btn-block" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => console.error('SW Error:', err));
    });
  }
</script>
</body>
</html>
