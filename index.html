<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GCSE Homeschool Tracker</title>
  
  <!-- Mobile & PWA Optimization -->
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GCSE Tracker">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%232563eb'/><text x='50%' y='60%' font-size='60' text-anchor='middle' fill='white'>📚</text></svg>">

  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font); background: var(--bg-main); color: var(--text-primary); line-height: 1.4; padding-bottom: 85px; }

    header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .logo { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .logo span { background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; text-transform: uppercase; }

    /* Mobile Bottom Navigation Bar */
    nav.mobile-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #ffffff;
      border-top: 1px solid var(--border); display: flex; justify-content: space-around;
      align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      background: none; border: none; display: flex; flex-direction: column; align-items: center;
      gap: 3px; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; flex: 1;
    }
    .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav-btn.active { color: var(--accent); }
    .nav-btn.active svg { stroke: var(--accent); }

    main { max-width: 900px; margin: 12px auto; padding: 0 12px; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
    .card-title { font-size: 1.05rem; font-weight: 700; }

    .btn { display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 600; padding: 8px 16px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; min-height: 42px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-outline { background: #fff; border-color: var(--border-dark); color: var(--text-secondary); }
    .btn-block { width: 100%; }

    /* Day Segment Selector for Mobile View */
    .day-selector { display: flex; background: var(--border); border-radius: 8px; padding: 2px; margin-bottom: 12px; }
    .day-btn { flex: 1; border: none; background: none; padding: 8px 0; font-size: 0.85rem; font-weight: 600; border-radius: 6px; color: var(--text-secondary); cursor: pointer; }
    .day-btn.active { background: #fff; color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

    /* Lesson List / Mobile Cards */
    .lesson-card {
      background: #fff; border: 1px solid var(--border); border-left: 5px solid var(--accent);
      border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: transform 0.1s;
    }
    .lesson-card:active { transform: scale(0.99); }
    .lesson-card.completed { border-left-color: var(--success); background: var(--success-bg); }
    .lesson-card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
    .lesson-tag-sub { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); }
    .lesson-card-focus { font-size: 0.92rem; font-weight: 600; color: var(--text-primary); }

    .progress-bar-wrap { background: var(--border); border-radius: 999px; height: 10px; overflow: hidden; width: 100%; margin: 6px 0; }
    .progress-bar-fill { background: var(--accent); height: 100%; border-radius: 999px; width: 0%; transition: width 0.3s ease; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .badge-planned { background: #e0f2fe; color: #0369a1; }
    .badge-done { background: var(--success-bg); color: var(--success); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
    .form-control { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border-dark); font-family: inherit; font-size: 0.95rem; }
    textarea.form-control { min-height: 90px; resize: vertical; }

    /* Modal Sheets on Mobile */
    .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 200; align-items: flex-end; justify-content: center; }
    .modal-backdrop.open { display: flex; }
    .modal-dialog {
      background: #fff; width: 100%; max-width: 600px; border-radius: 16px 16px 0 0; padding: 20px;
      max-height: 85vh; overflow-y: auto; box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">GCSE Tracker <span>Y10</span></div>
    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);" id="schedule-term-label"></div>
  </div>
</header>

<main>
  <!-- 1. SCHEDULE LAYER -->
  <section id="pane-schedule" class="tab-pane active">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Timetable</span>
        <div style="display: flex; gap: 6px; align-items: center;">
          <select id="schedule-week-select" class="form-control" style="width: auto; padding: 6px 8px;" onchange="renderSchedule()"></select>
        </div>
      </div>

      <!-- Mobile Day Filter -->
      <div class="day-selector">
        <button class="day-btn active" onclick="switchDay('Monday')">Mon</button>
        <button class="day-btn" onclick="switchDay('Tuesday')">Tue</button>
        <button class="day-btn" onclick="switchDay('Wednesday')">Wed</button>
        <button class="day-btn" onclick="switchDay('Thursday')">Thu</button>
      </div>

      <div id="mobile-lessons-container"></div>
    </div>
  </section>

  <!-- 2. CURRICULUM LAYER -->
  <section id="pane-curriculum" class="tab-pane">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Curriculum Registry</span>
        <button class="btn btn-outline" style="font-size:0.8rem; padding:4px 8px; min-height:auto;" onclick="resetToDefault()">Reset Defaults</button>
      </div>
      <div id="curriculum-list"></div>
      <button class="btn btn-outline btn-block" style="margin-top: 10px;" onclick="exportData()">Export Data Backup (JSON)</button>
    </div>
  </section>

  <!-- 3. DIARY LAYER -->
  <section id="pane-diary" class="tab-pane">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Study Log</span>
        <input type="date" id="diary-date-picker" class="form-control" style="width: auto; padding: 6px 8px;" onchange="renderDiary()">
      </div>
      <div class="form-group">
        <label>Session Notes & Observations</label>
        <textarea id="diary-notes" class="form-control" placeholder="What was covered? Retrieval errors, misconceptions, progress..."></textarea>
      </div>
      <div class="form-group">
        <label>Unplanned / Extra Learning</label>
        <input type="text" id="diary-extra" class="form-control" placeholder="Documentaries, reading, independent study...">
      </div>
      <button class="btn btn-primary btn-block" onclick="saveDiaryEntry()">Save Log Entry</button>
      <div id="diary-history" style="margin-top: 20px;"></div>
    </div>
  </section>

  <!-- 4. PROGRESS LAYER -->
  <section id="pane-progress" class="tab-pane">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Progress Metrics</span>
      </div>
      <div id="progress-summary"></div>
    </div>
  </section>
</main>

<!-- Bottom Nav -->
<nav class="mobile-nav">
  <button class="nav-btn active" onclick="switchTab('schedule')">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    Schedule
  </button>
  <button class="nav-btn" onclick="switchTab('curriculum')">
    <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
    Curriculum
  </button>
  <button class="nav-btn" onclick="switchTab('diary')">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
    Diary
  </button>
  <button class="nav-btn" onclick="switchTab('progress')">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
    Progress
  </button>
</nav>

<!-- Modal -->
<div id="lesson-modal" class="modal-backdrop">
  <div class="modal-dialog">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
      <h3 id="modal-subject" style="font-size: 1.1rem;"></h3>
      <span id="modal-status-badge" class="badge"></span>
    </div>
    <p id="modal-focus" style="color: var(--text-secondary); margin-bottom: 14px; font-weight: 600; font-size: 0.95rem;"></p>
    <div id="modal-content" style="background: var(--bg-main); padding: 12px; border-radius: 8px; font-size: 0.85rem; border: 1px solid var(--border); margin-bottom: 16px; white-space: pre-wrap; font-family: monospace; max-height: 240px; overflow-y: auto;"></div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <button id="modal-toggle-btn" class="btn btn-primary btn-block" onclick="toggleLessonCompletion()"></button>
      <button class="btn btn-outline btn-block" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(err => console.error('SW Error:', err));
    });
  }
</script>
</body>
</html>
